# Secrets live in AWS Secrets Manager, generated by Terraform (deploy/terraform/modules/database, ADR-007)
# and synced by External Secrets Operator via ClusterSecretStore "aws-secrets-manager" (NFR-08).
# Three secrets, least privilege:
#   scheduler-secrets           → API pods: DML-only app_url
#   scheduler-migrate-secrets   → Flyway container: DDL owner
#   scheduler-bootstrap-secrets → db-bootstrap init container only: RDS master + role passwords
# Keys are for production; the staging overlay rewrites scheduler/production/ → scheduler/staging/.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scheduler-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: scheduler-secrets }
  data:
    - secretKey: APP_DATABASE_URL          # role scheduler_app: SELECT/INSERT/UPDATE only
      remoteRef: { key: scheduler/production/db, property: app_url }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scheduler-migrate-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: scheduler-migrate-secrets }
  data:
    - secretKey: FLYWAY_URL                # role scheduler_owner: DDL
      remoteRef: { key: scheduler/production/db, property: flyway_jdbc_url }
    - secretKey: FLYWAY_USER
      remoteRef: { key: scheduler/production/db, property: flyway_user }
    - secretKey: FLYWAY_PASSWORD
      remoteRef: { key: scheduler/production/db, property: flyway_password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scheduler-bootstrap-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: scheduler-bootstrap-secrets }
  data:                                    # libpq variables → psql needs no connection arguments
    - { secretKey: PGHOST,         remoteRef: { key: scheduler/production/db-admin, property: host } }
    - { secretKey: PGPORT,         remoteRef: { key: scheduler/production/db-admin, property: port } }
    - { secretKey: PGDATABASE,     remoteRef: { key: scheduler/production/db-admin, property: dbname } }
    - { secretKey: PGUSER,         remoteRef: { key: scheduler/production/db-admin, property: username } }
    - { secretKey: PGPASSWORD,     remoteRef: { key: scheduler/production/db-admin, property: password } }
    - { secretKey: OWNER_USER,     remoteRef: { key: scheduler/production/db, property: owner_user } }
    - { secretKey: OWNER_PASSWORD, remoteRef: { key: scheduler/production/db, property: owner_password } }
    - { secretKey: APP_USER,       remoteRef: { key: scheduler/production/db, property: app_user } }
    - { secretKey: APP_PASSWORD,   remoteRef: { key: scheduler/production/db, property: app_password } }
