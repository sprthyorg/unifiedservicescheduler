  APP_LOG_LEVEL: INFO
  APP_DB_POOL_MAX_SIZE: "10"
  APP_SLOT_GRANULARITY_MINUTES: "15"   # A-05
  APP_MIN_LEAD_TIME_MINUTES: "60"      # A-06
  APP_BOOKING_HORIZON_DAYS: "90"       # A-07
  APP_ALTERNATIVES_COUNT: "3"          # FR-06
  APP_ALTERNATIVES_SEARCH_DAYS: "7"    # FR-06
  APPLY_DEMO_SEED: "false"             # V002 demo data — staging only
